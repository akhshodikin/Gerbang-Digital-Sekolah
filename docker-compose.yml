version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: sdn_tosari_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: absensi_sdn_kandangan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdn_tosari_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/absensi_sdn_kandangan
      AUTH_SECRET: sdn-kandangan-tosari-secret-key-32chars-minimum-security-2026-production
      SESSION_MAX_AGE_SECONDS: 86400
      PORT: 5000
      UPLOAD_DIR: /app/uploads
      NEXT_PUBLIC_APP_NAME: "ABSENSI QR CODE SDN KANDANGAN I TOSARI"
      NEXT_PUBLIC_SCHOOL_NAME: "SDN Kandangan I Tosari"
      NEXT_PUBLIC_SCHOOL_REGION: "Kecamatan Tosari, Kabupaten Pasuruan, Jawa Timur"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  pgdata:
  uploads_data:
